<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFAF6" />
      <stop offset="40%" stop-color="#FAF4E1" />
      <stop offset="100%" stop-color="#FCE1E7" />
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#967418" />
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bg3)" />
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="url(#g3)" stroke-width="2" rx="16" />
  
  <!-- Romantic oval framed bouquet -->
  <ellipse cx="300" cy="300" rx="140" ry="170" fill="#FFFDF8" stroke="url(#g3)" stroke-width="1.5" />
  
  <g transform="translate(300, 300)">
    <!-- Central Rose -->
    <circle cx="0" cy="0" r="38" fill="#FCE1E7" stroke="#EE9EB3" stroke-width="2" />
    <circle cx="0" cy="0" r="22" fill="#EE9EB3" />
    <circle cx="0" cy="0" r="10" fill="#DE7A95" />
    
    <!-- Surrounding blooms -->
    <circle cx="-55" cy="-20" r="24" fill="#FCE1E7" />
    <circle cx="55" cy="-20" r="24" fill="#FCE1E7" />
    <circle cx="-35" cy="45" r="26" fill="#FDF0F3" />
    <circle cx="35" cy="45" r="26" fill="#FDF0F3" />

    <!-- Sage Eucalyptus Leaves -->
    <path d="M-80,-50 C-110,-70 -115,-40 -85,-30 Z" fill="#9FB992" />
    <path d="M80,-50 C110,-70 115,-40 85,-30 Z" fill="#9FB992" />
    <path d="M-60,70 C-80,100 -50,105 -40,80 Z" fill="#759367" />
    <path d="M60,70 C80,100 50,105 40,80 Z" fill="#759367" />
  </g>

  <text x="300" y="520" font-family="'Cinzel', serif" font-size="28" letter-spacing="4" fill="#8C6514" text-anchor="middle" font-weight="600">
    TIMELESS JOY
  </text>
  <text x="300" y="560" font-family="'Montserrat', sans-serif" font-size="14" letter-spacing="3" fill="#6A6059" text-anchor="middle">
    NOVEMBER 29, 2026
  </text>
  <text x="300" y="590" font-family="'Cormorant Garamond', serif" font-style="italic" font-size="18" fill="#8C6514" text-anchor="middle">
    "Celebrating together with family &amp; friends"
  </text>
</svg>
